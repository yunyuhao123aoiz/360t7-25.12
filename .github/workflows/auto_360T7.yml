name: Auto ImmortalWrt 25.12 for 360T7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Build firmware
        run: |
          # 克隆 chasey-dev 25.12 仓库源码
          git clone https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt -b 25.12
          cd openwrt
          
          # 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 复制你自己的配置文件
          cp ../defconfig/rax3000m-360T7.config .config
          
          # ========== 修复：禁用 Rust 相关包，避免编译失败 ==========
          echo "# 禁用 Rust 和 Ruby（避免资源耗尽）" >> .config
          echo "# CONFIG_PACKAGE_rust is not set" >> .config
          echo "# CONFIG_PACKAGE_ruby is not set" >> .config
          echo "# CONFIG_PACKAGE_sing-box is not set" >> .config
          echo "# CONFIG_PACKAGE_shadowsocks-rust is not set" >> .config
          
          # 同步配置
          make defconfig
          
          # 下载编译所需的源码包
          make download -j$(nproc)
          
          # ========== 修复：强制单线程编译，减少内存压力 ==========
          make -j1 V=s
          
          # 删除 packages 目录（不需要上传）
          rm -rf bin/targets/mediatek/filogic/packages

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-rax3000m-firmware
          path: openwrt/bin/targets/mediatek/filogic/
          if-no-files-found: warn

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          name: "360T7 固件 ${{ steps.date.outputs.date }} #${{ github.run_number }}"
          tag_name: "build-${{ steps.date.outputs.date }}-${{ github.run_number }}"
          body: |
            ## 自动编译固件
            
            - 编译时间：${{ steps.date.outputs.date }}
            - 编译编号：#${{ github.run_number }}
            - 设备：360T7
            - 内核：6.12（25.12 版本）
            - 包含插件：OpenClash、passwall 磁盘管理、Argon 主题等
            - 上游：chasey-dev/immortalwrt-mt798x-rebase
          files: openwrt/bin/targets/mediatek/filogic/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
